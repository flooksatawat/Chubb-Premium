# Forgejo Service (deploy via Coolify)
# Save as docker-compose.yml in Coolify

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo
    restart: always
    environment:
      - FORGEJO__server__DOMAIN=git.hermes-codex.srv1846983.hstgr.cloud
      - FORGEJO__server__ROOT_URL=https://git.hermes-codex.srv1846983.hstgr.cloud
      - FORGEJO__server__SSH_DOMAIN=git.hermes-codex.srv1846983.hstgr.cloud
      - FORGEJO__server__DISABLE_REGISTRATION=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__server__LFS_START_SERVER=true
      - FORGEJO__database__DB_TYPE=sqlite3
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - forgejo-data:/data
      - forgejo-backup:/backup
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  forgejo-data:
  forgejo-backup: